spring.application.name=avicontrol

# Base de datos (docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/avicontrol
spring.datasource.username=avicontrol
spring.datasource.password=avicontrol
spring.jpa.hibernate.ddl-auto=validate

# Kafka (docker-compose.yml)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=modulo-1

# Jackson: no enviar nulos
spring.jackson.default-property-inclusion=non_null

# Propiedades propias
avicontrol.vaciado-sanitario.dias=3
avicontrol.vaciado-sanitario.cron=0 0 * * * *
avicontrol.reintento-intervalo-ms=1000
avicontrol.reintentos-maximos=3

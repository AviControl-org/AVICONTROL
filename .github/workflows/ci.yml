name: CI

# Corre las pruebas de los dos proyectos del repositorio en cada PR y en cada push a las ramas
# de integracion. Sin esto la rama develop estuvo con la build en rojo sin que nadie lo notara.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Un push nuevo a la misma rama cancela la corrida anterior, que ya no interesa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Preparar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Las pruebas de persistencia levantan PostgreSQL con Testcontainers; el runner de
      # ubuntu-latest ya trae Docker, asi que no hace falta configurar nada mas.
      - name: Pruebas del backend
        run: ./mvnw --batch-mode --no-transfer-progress clean test
        working-directory: avicontrol

      # Se publican tambien cuando las pruebas fallan: es justo cuando hacen falta.
      - name: Guardar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reportes-backend
          path: |
            avicontrol/target/surefire-reports/
            avicontrol/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Preparar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend

      - name: Pruebas del frontend
        run: npm test
        working-directory: frontend
